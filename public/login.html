<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPP & Tabungan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4ee 0%, #dce8d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.15);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 1.5rem; color: #1e4a2f; font-weight: 800; }
        .logo p { color: #6b8c5c; font-size: 0.85rem; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.78rem; color: #1e4a2f; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 14px 18px; border: 1.5px solid #dce6d4; border-radius: 16px; font-size: 0.9rem; transition: all 0.2s; }
        .form-group input:focus { outline: none; border-color: #3a7b44; box-shadow: 0 0 0 3px rgba(58,123,68,0.1); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 30px; font-size: 0.9rem; font-weight: 700; cursor: pointer; background: linear-gradient(95deg, #1e4a2f, #3a7b44); color: white; transition: all 0.25s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,74,47,0.3); }
        .error { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 12px; font-size: 0.8rem; margin-bottom: 16px; display: none; }
        .loading { display: none; text-align: center; padding: 8px; color: #6b8c5c; }
        .footer { text-align: center; margin-top: 20px; font-size: 0.72rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>RA ALJAWAHIR</h1>
            <p>Sistem SPP & Tabungan Terpadu</p>
        </div>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="Masukkan username" required autofocus></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Masukkan password" required></div>
            <div class="loading" id="loading">Memproses...</div>
            <button type="submit" class="btn" id="loginBtn">Masuk</button>
        </form>
        <div class="footer">Login default: admin / admin123</div>
    </div>
    <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('errorMsg');
        btn.disabled = true;
        loading.style.display = 'block';
        error.style.display = 'none';
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } else {
                error.textContent = data.error || 'Login gagal';
                error.style.display = 'block';
            }
        } catch (err) {
            error.textContent = 'Koneksi error: ' + err.message;
            error.style.display = 'block';
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    });
    </script>
</body>
</html>
